<script>
// 1. Materialendatabank met gecorrigeerde C:N-waarden en gewichten (80L per kruiwagen)
const MATERIALEN = {
    'groente': { naam: 'Vers Groente- & Fruitafval', cn: 15, type: 'groen', gewichtKw: 45 },
    'gras': { naam: 'Grasmaaisel (vers)', cn: 18, type: 'groen', gewichtKw: 35 },
    'onkruid': { naam: 'Vers Onkruid / Plantenresten', cn: 20, type: 'groen', gewichtKw: 30 },
    'mest_paard': { naam: 'Paardenmest (vers met stro)', cn: 25, type: 'groen', gewichtKw: 50 },
    'kroos': { naam: 'Slootkroos (uitgelekt)', cn: 12, type: 'groen', gewichtKw: 40 },
    'houtsnippers': { naam: 'Houtsnippers / Takken (Eliet gehakseld)', cn: 400, type: 'bruin', gewichtKw: 25 },
    'stro': { naam: 'Stro', cn: 80, type: 'bruin', gewichtKw: 12 },
    'blad': { naam: 'Droge Herfstbladeren', cn: 60, type: 'bruin', gewichtKw: 15 },
    'karton': { naam: 'Versnipperd Karton / Papier', cn: 350, type: 'bruin', gewichtKw: 15 }
};

// 2. Hoofdfunctie: Bereken C:N verhouding, Volume en Vrijdag-advies
function berekenCompostMix(invoerMaterialen, isVrijdagOpbouw = false) {
    let totaalKruiwagens = 0;
    let totaalGewogenCN = 0;
    let totaalGroenKw = 0;
    let totaalBruinKw = 0;

    invoerMaterialen.forEach(item => {
        const mat = MATERIALEN[item.id];
        if (mat && item.kruiwagens > 0) {
            totaalKruiwagens += item.kruiwagens;
            totaalGewogenCN += (mat.cn * item.kruiwagens);
            if (mat.type === 'groen') totaalGroenKw += item.kruiwagens;
            if (mat.type === 'bruin') totaalBruinKw += item.kruiwagens;
        }
    });

    if (totaalKruiwagens === 0) {
        return "<p>Voer het aantal kruiwagens in om de berekening te starten.</p>";
    }

    const berekendeCN = Math.round(totaalGewogenCN / totaalKruiwagens);
    const volumeLiters = totaalKruiwagens * 80; // 1 kw = 80 liter
    const volumeM3 = (volumeLiters / 1000).toFixed(2);

    let statusKleur = "#2e7d32"; // Groen (optimaal)
    let statusTekst = "";
    let bijstuurAdvies = "";

    // C:N Drempelwaarden (Streefwaarde 25:1 - 30:1)
    if (berekendeCN < 25) {
        statusKleur = "#d32f2f"; // Rood
        statusTekst = "⚠️ TE STIKSTOFRIJK (Te groen) — Risico op ammoniakstank, dichtzakken en gierlucht.";
        const nodigBruin = Math.ceil((28 * totaalKruiwagens - totaalGewogenCN) / (80 - 28));
        bijstuurAdvies = `Voeg ca. <strong>${nodigBruin > 0 ? nodigBruin : 1} kruiwagen(s) stro of houtsnippers</strong> toe om op een optimale balans (~28:1) uit te komen.`;
    } else if (berekendeCN > 30) {
        statusKleur = "#ed6c02"; // Oranje
        statusTekst = "⚠️ TE KOOLSTOFRIJK (Te bruin) — Het proces zal erg traag verlopen of koud blijven.";
        const nodigGroen = Math.ceil((totaalGewogenCN - 28 * totaalKruiwagens) / (28 - 18));
        bijstuurAdvies = `Voeg ca. <strong>${nodigGroen > 0 ? nodigGroen : 1} kruiwagen(s) vers gras of mest</strong> toe om op ~28:1 uit te komen.`;
    } else {
        statusTekst = "✅ OPTIMAAL BALANS (25:1 - 30:1) — Perfecte verhouding voor hete compostering!";
        bijstuurAdvies = "Geen bijsturing van materialen nodig. Bouw de hoop op in dunne afwisselende lagen.";
    }

    // Live Volumecheck (Minimaal 1 m³ = 12.5 kruiwagens van 80L)
    let volumeWaarschuwing = "";
    if (volumeM3 < 1.0) {
        volumeWaarschuwing = `<div style="background:#fff3e0; color:#e65100; padding:8px; border-radius:4px; margin-top:8px;">
            ⚠️ <strong>Volume Attentie:</strong> Het geschatte volume is ${volumeM3} m³ (${totaalKruiwagens} kruiwagens). Voor een hete composthoop volgens de Berkeley-methode is minimaal <strong>1 m³ (12,5 kruiwagens)</strong> nodig om warmte vast te houden. Vul aan!
        </div>`;
    } else {
        volumeWaarschuwing = `<div style="background:#e8f5e9; color:#2e7d32; padding:8px; border-radius:4px; margin-top:8px;">
            ✅ <strong>Volume OK:</strong> ${volumeM3} m³ (${totaalKruiwagens} kruiwagens) is voldoende massa voor het vasthouden van de kerntemperatuur (55–65 °C).
        </div>`;
    }

    // Vrijdagse Koolstofbuffer / Koolstofnest Protocol
    let vrijdagAdvies = "";
    if (isVrijdagOpbouw) {
        vrijdagAdvies = `<div style="background:#e3f2fd; color:#0d47a1; padding:10px; border-radius:4px; margin-top:10px; border-left:4px solid #1976d2;">
            📌 <strong>Vrijdag Protocol Stadslandbouw:</strong> Omdat de hoop tot woensdag 5 dagen stilstaat, breng je in de kern van de hoop een extra 'koolstofnest' van stro of houtsnippers aan rond de starter. Dek de hoop vrijdagmiddag af met <strong>UV-bestendig landbouwplastic</strong> tegen inwatering en uitdrogen! <em>(Let op: plastic uitsluitend op het compostterrein gebruiken, nooit op de teeltbedden).</em>
        </div>`;
    }

    return `
        <div style="border-left: 5px solid ${statusKleur}; padding-left: 12px; margin-top: 10px;">
            <h4>Berekende C/N-verhouding: <strong>${berekendeCN}:1</strong></h4>
            <p style="color: ${statusKleur}; font-weight: bold;">${statusTekst}</p>
            <p><strong>Bijstuuradvies:</strong> ${bijstuurAdvies}</p>
            ${volumeWaarschuwing}
            ${vrijdagAdvies}
        </div>
    `;
}

// 3. Stadslandbouw Arnhem Woensdag/Vrijdag Keerschema
function genereerKeerschema(startDatumStr, methode = 'stadslandbouw') {
    const d = new Date(startDatumStr);
    let schemaHTML = "<h4>Planning Keerschema:</h4><ul>";

    if (methode === 'stadslandbouw') {
        schemaHTML += `<li><strong>Woensdag (Dag 1):</strong> Opbouw hoop (lagen groen/bruin, bevochtigen volgens 50%-sponsregel).</li>`;
        schemaHTML += `<li><strong>Vrijdag (Dag 3):</strong> 1e keerbeurt / controle & afdekken met UV-landbouwplastic voor het weekend.</li>`;
        schemaHTML += `<li><strong>Woensdag (Dag 8):</strong> 2e grote keerbeurt (buitenste laag naar de hete kern verplaatsen).</li>`;
        schemaHTML += `<li><strong>Vervolg (Elke Wo & Vr):</strong> Blijven keren tot de temperatuur zakt en de compost egaal en donker ruikt (doorlooptijd ca. 4–6 weken).</li>`;
    } else {
        // Theoretische Berkeley 18-dagen
        schemaHTML += `<li><strong>Dag 1:</strong> Opbouw hoop (4 dagen laten rusten).</li>`;
        schemaHTML += `<li><strong>Dag 5, 7, 9, 11, 13, 15, 17:</strong> Elke 2 dagen keren van buiten naar binnen.</li>`;
        schemaHTML += `<li><strong>Dag 18:</strong> Oogst rijpe compost (na kiemtest met tuinkers).</li>`;
    }
    schemaHTML += "</ul>";
    return schemaHTML;
}
</script>
