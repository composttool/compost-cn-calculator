<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compostcalculator - Stadslandbouw Arnhem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #2e7d32; margin-top: 0; }
        .material-group {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .material-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        label { font-size: 14px; font-weight: bold; }
        input[type="number"] {
            width: 70px;
            padding: 6px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .checkbox-container {
            margin: 15px 0;
            background: #e3f2fd;
            padding: 10px;
            border-radius: 6px;
        }
        button {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #1b5e20; }
        #resultaat { margin-top: 20px; }
        .tag-groen { color: #2e7d32; font-size: 12px; }
        .tag-bruin { color: #e65100; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌱 Compostcalculator</h2>
    <p>Vul het aantal kruiwagens per materiaal in:</p>

    <form id="compostForm">
        <!-- STIKSTOFRIJK (GROEN) -->
        <h3 style="color:#2e7d32; font-size:16px;">Groen (Stikstofrijk)</h3>
        
        <div class="material-group">
            <div class="material-row">
                <label for="groente">Vers Groente- & Fruitafval <br><span class="tag-groen">C:N 15:1</span></label>
                <input type="number" id="groente" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="gras">Grasmaaisel (vers) <br><span class="tag-groen">C:N 18:1</span></label>
                <input type="number" id="gras" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="onkruid">Vers Onkruid / Smeerwortel <br><span class="tag-groen">C:N 19:1</span></label>
                <input type="number" id="onkruid" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="mest_paard">Paardenmest (vers) <br><span class="tag-groen">C:N 25:1</span></label>
                <input type="number" id="mest_paard" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="kroos">Slootkroos (uitgelekt) <br><span class="tag-groen">C:N 12:1</span></label>
                <input type="number" id="kroos" min="0" step="0.5" placeholder="0">
            </div>
        </div>

        <!-- KOOLSTOFRIJK (BRUIN) -->
        <h3 style="color:#e65100; font-size:16px;">Bruin (Koolstofrijk)</h3>
        
        <div class="material-group">
            <div class="material-row">
                <label for="stro">Stro / Gehakseld Riet <br><span class="tag-bruin">C:N 78:1</span></label>
                <input type="number" id="stro" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="blad">Droge Herfstbladeren <br><span class="tag-bruin">C:N 60:1</span></label>
                <input type="number" id="blad" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="houtsnippers">Houtsnippers (Eliet 4S) <br><span class="tag-bruin">C:N 400:1</span></label>
                <input type="number" id="houtsnippers" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="karton">Versnipperd Karton <br><span class="tag-bruin">C:N 350:1</span></label>
                <input type="number" id="karton" min="0" step="0.5" placeholder="0">
            </div>
            <div class="material-row">
                <label for="zaagsel">Houtzaagsel / Houtkrullen <br><span class="tag-bruin">C:N 400:1</span></label>
                <input type="number" id="zaagsel" min="0" step="0.5" placeholder="0">
            </div>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="isVrijdag">
            <label for="isVrijdag"> 📌 Wordt deze hoop op <strong>vrijdag</strong> opgebouwd? (Vrijdag-protocol)</label>
        </div>

        <button type="button" onclick="voerBerekeningUit()">Bereken C:N & Advies</button>
    </form>

    <div id="resultaat"></div>
</div>

<script>
const MATERIALEN = {
    'groente': { cn: 15, type: 'groen' },
    'gras': { cn: 18, type: 'groen' },
    'onkruid': { cn: 19, type: 'groen' },
    'mest_paard': { cn: 25, type: 'groen' },
    'kroos': { cn: 12, type: 'groen' },
    'stro': { cn: 78, type: 'bruin' },
    'blad': { cn: 60, type: 'bruin' },
    'houtsnippers': { cn: 400, type: 'bruin' },
    'karton': { cn: 350, type: 'bruin' },
    'zaagsel': { cn: 400, type: 'bruin' }
};

function voerBerekeningUit() {
    let totaalKruiwagens = 0;
    let totaalGewogenCN = 0;

    Object.keys(MATERIALEN).forEach(id => {
        const inputElem = document.getElementById(id);
        if (inputElem) {
            const aantal = parseFloat(inputElem.value) || 0;
            if (aantal > 0) {
                totaalKruiwagens += aantal;
                totaalGewogenCN += (MATERIALEN[id].cn * aantal);
            }
        }
    });

    const resultaatDiv = document.getElementById('resultaat');

    if (totaalKruiwagens === 0) {
        resultaatDiv.innerHTML = "<p style='color:red;'><strong>Voer bij minstens één materiaal een aantal kruiwagens in.</strong></p>";
        return;
    }

    const berekendeCN = Math.round(totaalGewogenCN / totaalKruiwagens);
    const volumeLiters = totaalKruiwagens * 80;
    const volumeM3 = (volumeLiters / 1000).toFixed(2);
    const isVrijdag = document.getElementById('isVrijdag').checked;

    let statusKleur = "#2e7d32";
    let statusTekst = "";
    let bijstuurAdvies = "";

    if (berekendeCN < 25) {
        statusKleur = "#d32f2f";
        statusTekst = "⚠️ TE STIKSTOFRIJK (Te groen) — Risico op stank, dichtzakken en gierlucht.";
        const nodigStro = Math.max(1, Math.ceil((28 * totaalKruiwagens - totaalGewogenCN) / (78 - 28)));
        const nodigSnippers = (Math.ceil(((28 * totaalKruiwagens - totaalGewogenCN) / (400 - 28)) * 10) / 10).toFixed(1);
        bijstuurAdvies = `Voeg ca. <strong>${nodigStro} kw stro</strong> OF <strong>${nodigSnippers} kw houtsnippers</strong> toe om op ~28:1 uit te komen.`;
    } else if (berekendeCN > 30) {
        statusKleur = "#ed6c02";
        statusTekst = "⚠️ TE KOOLSTOFRIJK (Te bruin) — Proces verloopt erg traag of blijft koud.";
        const nodigGras = Math.max(1, Math.ceil((totaalGewogenCN - 28 * totaalKruiwagens) / (28 - 18)));
        bijstuurAdvies = `Voeg ca. <strong>${nodigGras} kw vers gras of mest</strong> toe om op ~28:1 uit te komen.`;
    } else {
        statusTekst = "✅ OPTIMAAL BALANS (25:1 - 30:1) — Perfecte verhouding voor hete compostering!";
        bijstuurAdvies = "Geen bijsturing nodig. Bouw de hoop op in dunne afwisselende lagen.";
    }

    let volumeCheck = volumeM3 < 1.0 
        ? `<div style="background:#fff3e0; color:#e65100; padding:10px; border-radius:4px; margin-top:8px;">⚠️ <strong>Volume Attentie:</strong> Geschat volume is ${volumeM3} m³ (${totaalKruiwagens} kw). Minimaal <strong>1 m³ (12,5 kruiwagens)</strong> nodig voor een hete hoop!</div>`
        : `<div style="background:#e8f5e9; color:#2e7d32; padding:10px; border-radius:4px; margin-top:8px;">✅ <strong>Volume OK:</strong> ${volumeM3} m³ (${totaalKruiwagens} kw) is voldoende massa voor hete compostering!</div>`;

    let vrijdagAdvies = isVrijdag 
        ? `<div style="background:#e3f2fd; color:#0d47a1; padding:10px; border-radius:4px; margin-top:10px; border-left:4px solid #1976d2;">📌 <strong>Vrijdag Protocol:</strong> Breng een extra 'koolstofnest' van stro/houtsnippers aan in de kern en dek de hoop af met <strong>UV-bestendig landbouwplastic</strong> tegen het weekend.</div>`
        : '';

    resultaatDiv.innerHTML = `
        <div style="border-left: 5px solid ${statusKleur}; padding-left: 12px; background:#fafafa; padding: 10px; border-radius: 4px;">
            <h3 style="margin:0 0 5px 0;">Berekende C:N-ratio: <strong>${berekendeCN}:1</strong></h3>
            <p style="color:${statusKleur}; font-weight:bold; margin:5px 0;">${statusTekst}</p>
            <p style="margin:5px 0;"><strong>Bijstuuradvies:</strong> ${bijstuurAdvies}</p>
            ${volumeCheck}
            ${vrijdagAdvies}
        </div>
    `;
}
</script>

</body>
</html>
